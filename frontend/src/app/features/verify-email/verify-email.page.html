<ion-content [fullscreen]="true">
  <app-auth-layout>
    <div class="mail-art"><span class="ring r1"></span><span class="ring r2"></span><span class="env"><ion-icon name="mail-open"></ion-icon></span></div>

    <header class="intro">
      <h1>Verifica tu correo</h1>
      <p>Tu cuenta para <b>{{ email }}</b> ha sido creada con éxito.</p>
    </header>

    <form (ngSubmit)="onVerify()">
      <div class="field">
        <label for="token">Código de verificación</label>
        <div class="field-box"><ion-icon name="key-outline"></ion-icon>
          <input id="token" type="text" placeholder="Ingresa tu código de verificación" [(ngModel)]="token" name="token" autocomplete="one-time-code" /></div>
      </div>
      <button class="btn btn-primary btn-block" type="submit" [disabled]="!token.trim()">Verificar código <ion-icon name="checkmark-circle"></ion-icon></button>
    </form>

    <div class="resend" style="margin-top: 20px;">
      <span>¿Prefieres iniciar sesión?</span>
      <a routerLink="/login" style="color: var(--af-raspberry); font-weight: 700; text-decoration: none; margin-left: 6px;">Ir a Ingresar</a>
    </div>

    <p class="switch"><a routerLink="/register"><ion-icon name="arrow-back"></ion-icon>Usar otro correo</a></p>
  </app-auth-layout>
</ion-content>
