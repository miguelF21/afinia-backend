version: '3.8'

services:
  db:
    image: postgres:15
    container_name: afinia_db
    environment:
      POSTGRES_USER: afinia_user
      POSTGRES_PASSWORD: afinia_password
      POSTGRES_DB: afinia_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
    container_name: afinia_backend
    environment:
      DATABASE_URL: postgresql://afinia_user:afinia_password@db:5432/afinia_db
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: afinia_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
