openapi: 3.0.3
info:
  title: Afinia — Contrato de integración web y móvil
  version: 1.0.0-draft
  description: 'CONTRATO OBJETIVO PARA MOCKS (no describe funcionalidades ya desplegadas). Los ejemplos son sintéticos.
    Status x-implementation distingue código reportado de endpoints nuevos. Los esquemas pueden exigir migraciones
    posteriores a DB-02.

    Nota: el mock HTTP es ESTÁTICO y no persiste cambios de estado. Las cookies/refresh y la seguridad real requieren
    backend.'
servers:
- url: http://127.0.0.1:5000
  description: Flask local, cuando esté implementado
- url: http://127.0.0.1:4010
  description: Prism mock local
tags:
- name: Sistema
  description: Verificación de salud
- name: Autenticación
  description: Registro, sesiones y tokens
- name: Perfiles
  description: Datos de usuarios
- name: Descubrimiento
  description: Preferencias y candidatos
- name: Matches
  description: Interacciones y coincidencias
- name: Mensajería
  description: Conversaciones asociadas a matches
- name: Cuestionario
  description: Preguntas de preferencias no técnicas
- name: Seguridad
  description: Bloqueo, reportes y eliminación
- name: Legal
  description: Consentimiento
- name: Notificaciones
  description: Fase posterior
- name: Moderación
  description: Administración interna, no API de la app pública
paths:
  /health:
    get:
      tags:
      - Sistema
      summary: Comprobar que el proceso HTTP responde
      operationId: getHealth
      x-implementation: existente_no_verificado
      x-phase: infraestructura
      description: Contrato objetivo; no implica implementación actual.
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - status
              example:
                status: ok
      security: []
  /api/v1/auth/register:
    post:
      tags:
      - Autenticación
      summary: Registrar cuenta pendiente de onboarding
      operationId: register
      x-implementation: existente_requiere_alineacion
      x-phase: MVP
      description: El usuario no accede a discovery ni matches hasta finalizar el perfil y validar edad 18+ en servidor.
        La aceptación de términos debe registrar versiones y marca de tiempo en backend.
      responses:
        '201':
          description: Operación aceptada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserBrief'
                required:
                - data
              example:
                data: &id001
                  id: 11111111-1111-4111-8111-111111111111
                  email: ana@example.test
                  onboarding_complete: false
                  email_verified: false
                  status: pending_profile
        '400':
          description: Petición inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: BAD_REQUEST
                  message: Petición inválida
                  request_id: req_mock_001
        '409':
          description: Conflicto de estado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: CONFLICT
                  message: Conflicto de estado
                  request_id: req_mock_001
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Error de validación
                  request_id: req_mock_001
        '429':
          description: Límite de peticiones alcanzado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: RATE_LIMITED
                  message: Límite de peticiones alcanzado
                  request_id: req_mock_001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
            example:
              email: ana@example.test
              password: ClaveDemoSegura2026!
              accept_terms_version: v1-draft
              accept_privacy_version: v1-draft
      security: []
  /api/v1/auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión
      operationId: login
      x-implementation: existente_requiere_alineacion
      x-phase: MVP
      description: La política objetivo utiliza access token corto y renovación protegida; implementación actual
        descrita en auditoría usa JWT 24h. El refresh_token opcional solo se devuelve en móvil; en web la renovación
        se maneja en cookie HttpOnly.
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSession'
                required:
                - data
              example:
                data: &id002
                  access_token: mock-access-token-do-not-use-in-production
                  token_type: Bearer
                  expires_in: 900
                  user: *id001
        '400':
          description: Petición inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: BAD_REQUEST
                  message: Petición inválida
                  request_id: req_mock_001
        '401':
          description: Sesión inválida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Sesión inválida o ausente
                  request_id: req_mock_001
        '403':
          description: Acceso denegado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: FORBIDDEN
                  message: Acceso denegado
                  request_id: req_mock_001
        '429':
          description: Límite de peticiones alcanzado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: RATE_LIMITED
                  message: Límite de peticiones alcanzado
                  request_id: req_mock_001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              email: ana@example.test
              password: ClaveDemoSegura2026!
      security: []
  /api/v1/auth/refresh:
    post:
      tags:
      - Autenticación
      summary: Renovar sesión
      operationId: refreshSession
      x-implementation: nuevo
      x-phase: MVP
      description: 'Web: refresh en cookie HttpOnly, Secure y SameSite, con protección CSRF según la arquitectura
        final. Móvil: refresh_token en cuerpo, guardado seguro del dispositivo. Tokens rotativos sujetos a diseño
        de sesiones.'
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSession'
                required:
                - data
              example:
                data: *id002
        '401':
          description: Sesión inválida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Sesión inválida o ausente
                  request_id: req_mock_001
        '403':
          description: Acceso denegado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: FORBIDDEN
                  message: Acceso denegado
                  request_id: req_mock_001
        '429':
          description: Límite de peticiones alcanzado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: RATE_LIMITED
                  message: Límite de peticiones alcanzado
                  request_id: req_mock_001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
            example: {}
      security: []
  /api/v1/auth/logout:
    post:
      tags:
      - Autenticación
      summary: Cerrar sesión y revocar refresh
      operationId: logout
      x-implementation: nuevo
      x-phase: MVP
      description: Contrato objetivo; no implica implementación actual.
      responses:
        '204':
          description: Sin contenido
        '401':
          description: Sesión inválida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Sesión inválida o ausente
                  request_id: req_mock_001
  /api/v1/profile/:
    get:
      tags:
      - Perfiles
      summary: Obtener mi perfil
      operationId: getMyProfile
      x-implementation: existente_requiere_alineacion
      x-phase: MVP
      description: Contrato objetivo; no implica implementación actual.
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OwnProfile'
                required:
                - data
              example:
                data: &id003
                  user_id: 11111111-1111-4111-8111-111111111111
                  first_name: Ana
                  birth_date: '2002-04-10'
                  age: 24
                  gender: femenino
                  city: Villavicencio
                  bio: Me gusta la música.
                  photos: []
                  onboarding_complete: true
        '401':
          description: Sesión inválida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Sesión inválida o ausente
                  request_id: req_mock_001
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Error de validación
                  request_id: req_mock_001
    post:
      tags:
      - Perfiles
      summary: Crear perfil durante onboarding
      operationId: createMyProfile
      x-implementation: existente_requiere_alineacion
      x-phase: MVP
      description: El backend debe validar que el usuario sea adulto a partir de birth_date antes de activar su
        perfil. No basta validación Angular.
      responses:
        '201':
          description: Operación aceptada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OwnProfile'
                required:
                - data
              example:
                data: *id003
        '401':
          description: Sesión inválida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Sesión inválida o ausente
                  request_id: req_mock_001
        '409':
          description: Conflicto de estado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: CONFLICT
                  message: Conflicto de estado
                  request_id: req_mock_001
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Error de validación
                  request_id: req_mock_001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileWrite'
            example:
              first_name: Ana
              birth_date: '2002-04-10'
              gender: femenino
              city: Villavicencio
              bio: Me gusta la música.
    put:
      tags:
      - Perfiles
      summary: Actualizar mi perfil
      operationId: replaceMyProfile
      x-implementation: existente_requiere_alineacion
      x-phase: MVP
      description: Contrato objetivo; no implica implementación actual.
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OwnProfile'
                required:
                - data
              example:
                data: *id003
        '401':
          description: Sesión inválida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Sesión inválida o ausente
                  request_id: req_mock_001
        '403':
          description: Acceso denegado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: FORBIDDEN
                  message: Acceso denegado
                  request_id: req_mock_001
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Error de validación
                  request_id: req_mock_001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileWrite'
            example:
              first_name: Ana
              birth_date: '2002-04-10'
              gender: femenino
              city: Villavicencio
              bio: Me gusta la música.
  /api/v1/users/{userId}:
    get:
      tags:
      - Perfiles
      summary: Obtener perfil público visible
      operationId: getPublicProfile
      x-implementation: nuevo
      x-phase: MVP
      description: NUNCA retornar email, fecha de nacimiento, respuestas del cuestionario, tokens ni datos ocultos.
        Bloqueos y visibilidad aplicados en servidor.
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PublicProfile'
                required:
                - data
              example:
                data: &id006
                  user_id: 22222222-2222-4222-8222-222222222222
                  first_name: Luis
                  age: 24
                  gender: masculino
                  city: Villavicencio
                  bio: Me gusta caminar y conocer lugares nuevos.
                  photos:
                  - &id004
                    id: 66666666-6666-4666-8666-666666666666
                    url: https://media.example.test/demo/photo-1.webp
                    is_primary: true
                  relationship_goal: seria
        '401':
          description: Sesión inválida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Sesión inválida o ausente
                  request_id: req_mock_001
        '403':
          description: Acceso denegado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: FORBIDDEN
                  message: Acceso denegado
                  request_id: req_mock_001
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: NOT_FOUND
                  message: No encontrado
                  request_id: req_mock_001
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Identificador UUID de la entidad
  /api/v1/profile/photos:
    post:
      tags:
      - Perfiles
      summary: Subir fotografía de perfil
      operationId: uploadPhoto
      x-implementation: nuevo
      x-phase: MVP
      description: Imágenes JPEG/PNG/WEBP hasta 10 MB, máximo seis por perfil; validar MIME, contenido real, autorización
        y moderación. URL ilustrativa, aún no existe storage contratado.
      responses:
        '201':
          description: Operación aceptada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Photo'
                required:
                - data
              example:
                data: *id004
        '400':
          description: Petición inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: BAD_REQUEST
                  message: Petición inválida
                  request_id: req_mock_001
        '401':
          description: Sesión inválida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Sesión inválida o ausente
                  request_id: req_mock_001
        '413':
          description: Archivo demasiado grande
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: PAYLOAD_TOO_LARGE
                  message: Archivo demasiado grande
                  request_id: req_mock_001
        '415':
          description: Tipo de archivo no admitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UNSUPPORTED_MEDIA_TYPE
                  message: Tipo de archivo no admitido
                  request_id: req_mock_001
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Error de validación
                  request_id: req_mock_001
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                is_primary:
                  type: boolean
                  default: false
              required:
              - file
  /api/v1/profile/photos/{photoId}:
    delete:
      tags:
      - Perfiles
      summary: Eliminar una foto propia
      operationId: deletePhoto
      x-implementation: nuevo
      x-phase: MVP
      description: Contrato objetivo; no implica implementación actual.
      responses:
        '204':
          description: Sin contenido
        '401':
          description: Sesión inválida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
