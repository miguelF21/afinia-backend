                required:
                - data
              example:
                data:
                  status: resolved
        '401':
          description: Sesión inválida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Sesión inválida o ausente
                  request_id: req_mock_001
        '403':
          description: Acceso denegado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: FORBIDDEN
                  message: Acceso denegado
                  request_id: req_mock_001
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: NOT_FOUND
                  message: No encontrado
                  request_id: req_mock_001
        '409':
          description: Conflicto de estado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: CONFLICT
                  message: Conflicto de estado
                  request_id: req_mock_001
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Error de validación
                  request_id: req_mock_001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportResolution'
            example:
              action: suspend
              notes: Incumplimiento confirmado.
      parameters:
      - name: reportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Identificador UUID de la entidad
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Revisa los datos enviados.
        details:
          type: object
          additionalProperties: true
        request_id:
          type: string
          example: req_mock_001
      required:
      - code
      - message
    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      required:
      - error
    UserBrief:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        email:
          type: string
          format: email
          example: ana@example.test
        onboarding_complete:
          type: boolean
          example: false
        email_verified:
          type: boolean
          example: false
        status:
          type: string
          enum:
          - pending_profile
          - active
          - suspended
          - deactivated
      required:
      - id
      - email
      - onboarding_complete
      - email_verified
      - status
    AuthSession:
      type: object
      properties:
        access_token:
          type: string
          example: mock-access-token-do-not-use-in-production
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          minimum: 1
          example: 900
        refresh_token:
          type: string
          description: Solo en app móvil; en web se utiliza cookie HttpOnly segura. No guardar en localStorage.
          example: mock-refresh-token-mobile-only
        user:
          $ref: '#/components/schemas/UserBrief'
      required:
      - access_token
      - token_type
      - expires_in
      - user
    RegisterInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: ana@example.test
        password:
          type: string
          minLength: 12
          maxLength: 128
          example: ClaveDemoSegura2026!
        accept_terms_version:
          type: string
          example: v1-draft
        accept_privacy_version:
          type: string
          example: v1-draft
      additionalProperties: false
      required:
      - email
      - password
      - accept_terms_version
      - accept_privacy_version
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
          example: ana@example.test
        password:
          type: string
          example: ClaveDemoSegura2026!
      additionalProperties: false
      required:
      - email
      - password
    RefreshInput:
      type: object
      properties:
        refresh_token:
          type: string
          description: En móvil se envía refresh_token. En web usar cookie HttpOnly.
      additionalProperties: false
    Photo:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 66666666-6666-4666-8666-666666666666
        url:
          type: string
          format: uri
          example: https://media.example.test/demo/photo-1.webp
        is_primary:
          type: boolean
          example: true
      required:
      - id
      - url
      - is_primary
    PublicProfile:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          example: 22222222-2222-4222-8222-222222222222
        first_name:
          type: string
          example: Luis
        age:
          type: integer
          minimum: 18
          example: 24
        gender:
          type: string
          enum: &id014
          - masculino
          - femenino
          - no_binario
          - otro
          - prefiero_no_indicar
        city:
          type: string
          example: Villavicencio
          nullable: true
        bio:
          type: string
          example: Me gusta caminar y conocer lugares nuevos.
          nullable: true
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        relationship_goal:
          type: string
          enum: &id015
          - seria
          - casual
          - amistad
          - sin_definir
          nullable: true
      required:
      - user_id
      - first_name
      - age
      - gender
      - photos
    OwnProfile:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        first_name:
          type: string
          example: Ana
        birth_date:
          type: string
          format: date
          example: '2002-04-10'
        age:
          type: integer
          minimum: 18
          example: 24
        gender:
          type: string
          enum: *id014
        city:
          type: string
          example: Villavicencio
          nullable: true
        bio:
          type: string
          example: Me gusta la música.
          nullable: true
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        onboarding_complete:
          type: boolean
          example: true
      required:
      - user_id
      - first_name
      - birth_date
      - age
      - gender
      - photos
      - onboarding_complete
    ProfileWrite:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 50
          example: Ana
        birth_date:
          type: string
          format: date
          example: '2002-04-10'
        gender:
          type: string
          enum: *id014
        city:
          type: string
          maxLength: 100
          example: Villavicencio
        bio:
          type: string
          maxLength: 1000
          example: Me gusta la música.
      additionalProperties: false
      required:
      - first_name
      - birth_date
      - gender
    Preferences:
      type: object
      properties:
        interested_in_genders:
          type: array
          items:
            type: string
            enum: *id014
          minItems: 1
          uniqueItems: true
          example:
          - masculino
          - no_binario
        min_age:
          type: integer
          minimum: 18
          maximum: 120
          example: 21
        max_age:
          type: integer
          minimum: 18
          maximum: 120
          example: 35
        target_relationship_type:
          type: string
          enum: *id015
          nullable: true
      required:
      - interested_in_genders
      - min_age
      - max_age
    SwipeInput:
      type: object
      properties:
        target_user_id:
          type: string
          format: uuid
          example: 22222222-2222-4222-8222-222222222222
        action:
          type: string
          enum: &id016
          - LIKE
          - PASS
      additionalProperties: false
      required:
      - target_user_id
      - action
    SwipeResult:
      type: object
      properties:
        interaction_id:
          type: string
          format: uuid
          example: 77777777-7777-4777-8777-777777777777
        action:
          type: string
          enum: *id016
        is_match:
          type: boolean
          example: true
        match_id:
          type: string
          format: uuid
          example: 44444444-4444-4444-8444-444444444444
          nullable: true
      required:
      - interaction_id
      - action
      - is_match
      - match_id
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 55555555-5555-4555-8555-555555555555
        match_id:
          type: string
          format: uuid
          example: 44444444-4444-4444-8444-444444444444
        sender_user_id:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        text:
          type: string
          minLength: 1
          maxLength: 2000
          example: ¡Hola! ¿Cómo estás?
        sent_at:
          type: string
          format: date-time
          example: '2026-10-27T16:20:00Z'
        read_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - match_id
      - sender_user_id
      - text
      - sent_at
      - read_at
    Match:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 44444444-4444-4444-8444-444444444444
        other_user:
          $ref: '#/components/schemas/PublicProfile'
        created_at:
          type: string
          format: date-time
          example: '2026-10-27T16:20:00Z'
        last_message:
          $ref: '#/components/schemas/Message'
          nullable: true
        unread_count:
          type: integer
          minimum: 0
          example: 0
      required:
      - id
      - other_user
      - created_at
      - unread_count
    Question:
      type: object
      properties:
        id:
          type: string
          example: importance_communication
        label:
          type: string
          example: ¿Qué tan importante es para ti la comunicación?
        type:
          type: string
          enum:
          - scale_1_5
        required:
          type: boolean
          example: true
        min:
          type: integer
          example: 1
        max:
          type: integer
          example: 5
      required:
      - id
      - label
      - type
      - required
    Questionnaire:
      type: object
      properties:
        version:
          type: string
          example: draft-1
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
      required:
      - version
      - questions
    AnswerItem:
      type: object
      properties:
        question_id:
          type: string
          example: importance_communication
        value:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
      required:
      - question_id
      - value
    AnswersInput:
      type: object
      properties:
        version:
          type: string
          example: draft-1
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerItem'
      additionalProperties: false
      required:
      - version
      - answers
    AnswersResult:
      type: object
      properties:
        version:
          type: string
          example: draft-1
        saved_count:
          type: integer
          example: 2
        updated_at:
          type: string
          format: date-time
          example: '2026-10-27T16:20:00Z'
      required:
      - version
      - saved_count
      - updated_at
    ReportInput:
      type: object
      properties:
        reason:
          type: string
          enum:
          - acoso
          - contenido_inapropiado
          - suplantacion
          - spam
          - otro
        description:
          type: string
          maxLength: 1000
          example: El perfil envía mensajes inapropiados.
      additionalProperties: false
      required:
      - reason
    ReportReceipt:
      type: object
      properties:
        report_id:
          type: string
          format: uuid
          example: 88888888-8888-4888-8888-888888888888
        status:
          type: string
          enum:
          - received
      required:
      - report_id
      - status
    BlockReceipt:
      type: object
      properties:
        blocked_user_id:
          type: string
          format: uuid
          example: 33333333-3333-4333-8333-333333333333
        blocked:
          type: boolean
          example: true
      required:
      - blocked_user_id
      - blocked
    LegalVersions:
      type: object
      properties:
        terms_version:
          type: string
          example: v1-draft
        privacy_version:
          type: string
          example: v1-draft
        terms_url:
          type: string
          format: uri
          example: https://legal.example.test/terms
        privacy_url:
          type: string
          format: uri
          example: https://legal.example.test/privacy
      required:
      - terms_version
      - privacy_version
      - terms_url
      - privacy_url
    LegalAcceptance:
      type: object
      properties:
        terms_version:
          type: string
          example: v1-draft
        privacy_version:
          type: string
          example: v1-draft
      additionalProperties: false
      required:
      - terms_version
      - privacy_version
    AccountDeletionInput:
      type: object
      properties:
        password:
          type: string
          example: ClaveDemoSegura2026!
        confirm:
          type: boolean
          enum:
          - true
      additionalProperties: false
      required:
      - password
      - confirm
    DeletionReceipt:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
          example: 99999999-9999-4999-8999-999999999999
        status:
          type: string
          enum:
          - accepted
        sessions_revoked:
          type: boolean
          example: true
      required:
      - request_id
      - status
      - sessions_revoked
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        type:
          type: string
          enum:
          - new_match
          - new_message
        title:
          type: string
          example: Tienes un nuevo match
        created_at:
          type: string
          format: date-time
          example: '2026-10-27T16:20:00Z'
        read:
          type: boolean
          example: false
      required:
      - id
      - type
      - title
      - created_at
      - read
    ModerationReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 88888888-8888-4888-8888-888888888888
        reporter_user_id:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        reported_user_id:
          type: string
          format: uuid
          example: 33333333-3333-4333-8333-333333333333
        reason:
          type: string
          enum:
          - acoso
          - contenido_inapropiado
          - suplantacion
          - spam
          - otro
        status:
          type: string
          enum:
          - pending
          - resolved
          - dismissed
        created_at:
          type: string
          format: date-time
          example: '2026-10-27T16:20:00Z'
      required:
      - id
      - reported_user_id
      - reason
      - status
      - created_at
    ReportResolution:
      type: object
      properties:
        action:
          type: string
          enum:
          - dismiss
          - warn
          - suspend
        notes:
          type: string
          maxLength: 1000
          example: Incumplimiento confirmado.
      additionalProperties: false
      required:
      - action
security:
- BearerAuth: []
