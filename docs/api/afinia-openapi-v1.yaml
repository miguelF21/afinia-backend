          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: FORBIDDEN
                  message: Acceso denegado
                  request_id: req_mock_001
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: NOT_FOUND
                  message: No encontrado
                  request_id: req_mock_001
      parameters:
      - name: photoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Identificador UUID de la entidad
  /api/v1/profile/discovery-preferences:
    get:
      tags:
      - Descubrimiento
      summary: Consultar preferencias de búsqueda
      operationId: getPreferences
      x-implementation: nuevo
      x-phase: MVP
      description: El modelo ORM actual usa interesado_en_genero escalar; este contrato define lista inclusiva,
        requiere migración y adaptación de filtros.
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Preferences'
                required:
                - data
              example:
                data: &id005
                  interested_in_genders:
                  - masculino
                  - no_binario
                  min_age: 21
                  max_age: 35
                  target_relationship_type: seria
        '401':
          description: Sesión inválida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Sesión inválida o ausente
                  request_id: req_mock_001
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Error de validación
                  request_id: req_mock_001
    put:
      tags:
      - Descubrimiento
      summary: Guardar preferencias de búsqueda
      operationId: putPreferences
      x-implementation: nuevo
      x-phase: MVP
      description: Contrato objetivo; no implica implementación actual.
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Preferences'
                required:
                - data
              example:
                data: *id005
        '401':
          description: Sesión inválida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Sesión inválida o ausente
                  request_id: req_mock_001
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Error de validación
                  request_id: req_mock_001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example: *id005
  /api/v1/match/potential:
    get:
      tags:
      - Descubrimiento
      summary: Obtener candidatos filtrados y paginados
      operationId: getCandidates
      x-implementation: existente_roto
      x-phase: MVP
      description: 'Sin porcentajes de compatibilidad ni números aleatorios. Exclusión: yo mismo, cuentas inactivas/incompletas,
        bloqueados y ya vistos. Filtros de edades y géneros; orden estable para cursor.'
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/PublicProfile'
                    required:
                    - items
                  meta:
                    type: object
                    properties:
                      next_cursor:
                        type: string
                        nullable: true
                      has_more:
                        type: boolean
                    required:
                    - next_cursor
                    - has_more
                required:
                - data
                - meta
              examples:
                normal:
                  summary: Escenario predeterminado
                  value:
                    data:
                      items:
                      - *id006
                      - &id013
                        user_id: 33333333-3333-4333-8333-333333333333
                        first_name: Camila
                        age: 25
                        gender: femenino
                        city: Bogotá
                        bio: Café, libros y planes al aire libre.
                        photos: []
                        relationship_goal: seria
                    meta:
                      next_cursor: null
                      has_more: false
                sin_candidatos:
                  summary: sin candidatos
                  value:
                    data:
                      items: []
                    meta:
                      next_cursor: null
                      has_more: false
                un_candidato:
                  summary: un candidato
                  value:
                    data:
                      items:
                      - *id006
                    meta:
                      next_cursor: null
                      has_more: false
        '401':
          description: Sesión inválida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Sesión inválida o ausente
                  request_id: req_mock_001
        '403':
          description: Acceso denegado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: FORBIDDEN
                  message: Acceso denegado
                  request_id: req_mock_001
        '422':
          description: Error de validación
          content:
